name: Terraform Deploy

on:
  pull_request:
    paths:
      - "modules/**"
      - "stages/**"
      - "workflows/**"
      - ".github/workflows/terraform-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "stages/**"
      - "workflows/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Check formatting and validate stages
        run: |
          make fmt-check
          make validate

  plan-pr:
    needs: validate
    if: github.event_name == 'pull_request' && vars.GCP_WIF_PROVIDER != '' && vars.TF_STATE_BUCKET != ''
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Link foundation outputs when configured
        if: vars.IAC_OUTPUTS_BUCKET != ''
        run: |
          ./scripts/link-stages.sh --env dev \
            --from-gcs "gs://${{ vars.IAC_OUTPUTS_BUCKET }}/foundation-outputs.json" \
            stages/enterprise

      - name: Terraform init and plan
        run: |
          terraform -chdir=stages/enterprise init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ingestion/enterprise/dev"
          if [ -f stages/enterprise/envs/dev.tfvars ]; then
            terraform -chdir=stages/enterprise plan -var-file=envs/dev.tfvars
          else
            terraform -chdir=stages/enterprise plan
          fi

  apply-dev:
    needs: validate
    if: |
      vars.GCP_WIF_PROVIDER != '' && vars.TF_STATE_BUCKET != '' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'))
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Link foundation outputs when configured
        if: vars.IAC_OUTPUTS_BUCKET != ''
        run: |
          ./scripts/link-stages.sh --env dev \
            --from-gcs "gs://${{ vars.IAC_OUTPUTS_BUCKET }}/foundation-outputs.json" \
            stages/enterprise

      - name: Terraform init and apply (dev)
        run: |
          terraform -chdir=stages/enterprise init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ingestion/enterprise/dev"
          if [ -f stages/enterprise/envs/dev.tfvars ]; then
            terraform -chdir=stages/enterprise apply -auto-approve -var-file=envs/dev.tfvars
          else
            terraform -chdir=stages/enterprise apply -auto-approve
          fi

  apply-staging:
    needs: apply-dev
    if: |
      always() && (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped') &&
      vars.GCP_WIF_PROVIDER != '' && vars.TF_STATE_BUCKET != '' &&
      ((github.event_name == 'push' && vars.AUTO_PROMOTE_STAGING == 'true') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Link foundation outputs when configured
        if: vars.IAC_OUTPUTS_BUCKET != ''
        run: |
          ./scripts/link-stages.sh --env staging \
            --from-gcs "gs://${{ vars.IAC_OUTPUTS_BUCKET }}/foundation-outputs.json" \
            stages/enterprise

      - name: Terraform init and apply (staging)
        run: |
          terraform -chdir=stages/enterprise init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ingestion/enterprise/staging"
          if [ -f stages/enterprise/envs/staging.tfvars ]; then
            terraform -chdir=stages/enterprise apply -auto-approve -var-file=envs/staging.tfvars
          else
            terraform -chdir=stages/enterprise apply -auto-approve
          fi

  apply-prod:
    needs: apply-staging
    if: |
      always() && (needs.apply-staging.result == 'success' || needs.apply-staging.result == 'skipped') &&
      vars.GCP_WIF_PROVIDER != '' && vars.TF_STATE_BUCKET != '' &&
      github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Link foundation outputs when configured
        if: vars.IAC_OUTPUTS_BUCKET != ''
        run: |
          ./scripts/link-stages.sh --env prod \
            --from-gcs "gs://${{ vars.IAC_OUTPUTS_BUCKET }}/foundation-outputs.json" \
            stages/enterprise

      - name: Terraform init and apply (prod)
        run: |
          terraform -chdir=stages/enterprise init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ingestion/enterprise/prod"
          if [ -f stages/enterprise/envs/prod.tfvars ]; then
            terraform -chdir=stages/enterprise apply -auto-approve -var-file=envs/prod.tfvars
          else
            terraform -chdir=stages/enterprise apply -auto-approve
          fi
